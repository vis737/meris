services:
  - type: web
    name: meris-eshop
    runtime: node
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: APP_URL
        sync: false        # Set this to your actual Render URL in the dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false        # Set a strong password in the dashboard
      - key: SUPABASE_URL
        sync: false        # Your Supabase project URL
      - key: SUPABASE_KEY
        sync: false        # Your Supabase service-role key (keep secret!)
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false        # Your Gmail address
      - key: SMTP_PASS
        sync: false        # Your Gmail App Password (16 chars, no spaces)
      - key: SMTP_FROM_NAME
        value: Meris E-Shop
      - key: SMTP_FROM_EMAIL
        sync: false        # Same as SMTP_USER typically
      - key: ADMIN_NOTIFICATION_EMAIL
        value: meriseshop.2025@gmail.com   # Admin inbox for new-order alerts
      - key: ENABLE_REAL_NOTIFICATIONS
        value: "true"
      - key: GEMINI_API_KEY
        sync: false        # Optional: for AI recommendations
      - key: PAYU_MERCHANT_KEY
        sync: false        # Your PayU merchant key
      - key: PAYU_MERCHANT_SALT
        sync: false        # Your PayU merchant salt
      - key: PAYU_ENV
        value: production
      - key: PAYU_SUCCESS_URL
        sync: false        # Optional: https://your-app.onrender.com/api/payu/success
      - key: PAYU_FAILURE_URL
        sync: false        # Optional: https://your-app.onrender.com/api/payu/failure
      - key: PAYU_WEBHOOK_URL
        sync: false        # Optional: https://your-app.onrender.com/api/payu/webhook
